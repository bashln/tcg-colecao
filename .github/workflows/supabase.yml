name: supabase

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# O harness sobe um PostgreSQL efemero com as migracoes aplicadas verbatim e
# exercita as fronteiras de RLS e RPC. Sem este job, o schema remoto pode divergir
# do codigo sem ninguem notar.
jobs:
  postgres-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: supabase/tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: supabase/tests/package-lock.json

      - name: Instalar dependencias do harness
        run: npm ci

      - name: Rodar harness de PostgreSQL
        run: npm test
