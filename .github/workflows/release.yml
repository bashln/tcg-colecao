name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    # Secrets cannot be read directly in `if:`; expose the keystore secret as job env so the
    # guard can gate on it. Missing secrets must fail the run, never publish a debug build.
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      EXPECTED_SIGNING_CERT_SHA256: d31a9c98580212663993b2ee7ea757e05fa284ccd2b54ad3b38e6b92a4c3f88f
    steps:
      - uses: actions/checkout@v4

      - name: Testar guards de release
        run: |
          ./scripts/validate-release.test.sh
          ./scripts/verify-release-tag.test.sh
          ./scripts/verify-release-signature.test.sh

      - name: Exigir keystore de release
        if: env.KEYSTORE_BASE64 == ''
        run: |
          echo "::error::ANDROID_KEYSTORE_BASE64 ausente. Uma tag de release sem os secrets falha aqui em vez de publicar um APK assinado com debug."
          exit 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Derivar versão da tag
        run: |
          release_tag="$GITHUB_REF_NAME"
          code="$(./scripts/validate-release.sh "$release_tag" "tcg-colecao-${release_tag}.apk")"
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "TCG_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "TCG_VERSION_NAME=${release_tag#v}" >> "$GITHUB_ENV"

      # Guard fail-closed: supported tag, versionCode above all existing releases, and exact APK
      # name. A tag-push event builds its own tagged commit; no separate dispatch ref is accepted.
      - name: Guardar contrato de release (tag/versao/ativo)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          releases="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name')"
          mapfile -t existing <<< "$releases"
          version_code="$(./scripts/validate-release.sh "$RELEASE_TAG" "tcg-colecao-${RELEASE_TAG}.apk" "${existing[@]}")"
          echo "release-guard: versionCode=${version_code} aceito"

      - name: Compilar APK de release
        env:
          TCG_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          TCG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TCG_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TCG_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Verificar assinatura de release
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner nao encontrado no Android SDK."
            exit 1
          fi
          certs="$("$apksigner" verify --print-certs "$apk")"
          if ! printf '%s\n' "$certs" | ./scripts/verify-release-signature.sh "$EXPECTED_SIGNING_CERT_SHA256"; then
            echo "::group::apksigner certificate output (public certificate metadata)"
            printf '%s\n' "$certs"
            echo "::endgroup::"
            echo "::error::O APK nao esta assinado com o certificado de release fixado. Nada e publicado."
            exit 1
          fi

      - name: Renomear APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/tcg-colecao-${RELEASE_TAG}.apk"

      - name: Registrar digest SHA-256 do APK
        run: |
          digest="$(sha256sum "out/tcg-colecao-${RELEASE_TAG}.apk" | cut -d' ' -f1)"
          echo "SHA-256 (tcg-colecao-${RELEASE_TAG}.apk): ${digest}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Confirmar que tag ainda aponta para o commit compilado
        run: ./scripts/verify-release-tag.sh "$RELEASE_TAG"

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: out/*.apk
          prerelease: ${{ contains(env.RELEASE_TAG, '-alpha.') }}
          generate_release_notes: true
