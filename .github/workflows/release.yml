name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    # Secrets cannot be read directly in `if:`; expose the keystore secret as job env so the
    # guard can gate on it. Missing secrets must fail the run, never publish a debug build.
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      EXPECTED_SIGNING_CERT_SHA256: d31a9c98580212663993b2ee7ea757e05fa284ccd2b54ad3b38e6b92a4c3f88f
    steps:
      - uses: actions/checkout@v4

      - name: Exigir keystore de release
        if: env.KEYSTORE_BASE64 == ''
        run: |
          echo "::error::ANDROID_KEYSTORE_BASE64 ausente. Uma tag de release sem os secrets falha aqui em vez de publicar um APK assinado com debug."
          exit 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Derivar versao da tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          IFS='.' read -r major minor patch <<< "$version"
          patch="${patch%%-*}"
          if ! [[ "$major" =~ ^[0-9]+$ && "$minor" =~ ^[0-9]+$ && "$patch" =~ ^[0-9]+$ ]]; then
            echo "::error::A tag ${GITHUB_REF_NAME} nao segue o formato vMAJOR.MINOR.PATCH."
            exit 1
          fi
          echo "TCG_VERSION_NAME=${major}.${minor}.${patch}" >> "$GITHUB_ENV"
          echo "TCG_VERSION_CODE=$(( major * 10000 + minor * 100 + patch ))" >> "$GITHUB_ENV"

      # Guard fail-closed: tag estável exata, versionCode acima de tudo já publicado e nome de
      # ativo correto. Testado por scripts/validate-release.test.sh; roda sem segredos.
      - name: Buscar tags para o guard de release
        run: git fetch --tags --force origin

      - name: Guardar contrato de release (tag/versao/ativo)
        run: |
          mapfile -t existing < <(git tag -l 'v*' | grep -xE 'v[0-9]+\.[0-9]+\.[0-9]+' | grep -vxF "$GITHUB_REF_NAME" || true)
          version_code="$(./scripts/validate-release.sh "$GITHUB_REF_NAME" "tcg-colecao-${GITHUB_REF_NAME}.apk" "${existing[@]}")"
          echo "release-guard: versionCode=${version_code} aceito"

      - name: Compilar APK de release
        env:
          TCG_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          TCG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TCG_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TCG_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Verificar assinatura de release
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner nao encontrado no Android SDK."
            exit 1
          fi
          certs="$("$apksigner" verify --print-certs "$apk")"
          if ! printf '%s\n' "$certs" | ./scripts/verify-release-signature.sh "$EXPECTED_SIGNING_CERT_SHA256"; then
            echo "::error::O APK nao esta assinado com o certificado de release fixado. Nada e publicado."
            exit 1
          fi

      - name: Renomear APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/tcg-colecao-${GITHUB_REF_NAME}.apk"

      - name: Registrar digest SHA-256 do APK
        run: |
          digest="$(sha256sum "out/tcg-colecao-${GITHUB_REF_NAME}.apk" | cut -d' ' -f1)"
          echo "SHA-256 (tcg-colecao-${GITHUB_REF_NAME}.apk): ${digest}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
